[package]
name = "fakeit"
version = "0.4.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true

[[example]]
# crate-type can't be (at the moment) be overriden for specific targets
# src/wasm_lib.rs forwards to src/lib.rs so that we can change from cdylib
# (that is needed while compiling natively) to staticlib (needed since the
# actual linking will be done via emcc
name = "fakeit"
path = "src/wasm_lib.rs"
crate-type = ["staticlib"]

[dependencies]
duckdb-neo = { version = "0.20000.0", default-features = false, features = ["build-extension"] }
duckdb-loadable-macros = { version = "1.20000.0", features = ["neo"] }
fakeit = "1.4.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# fakeit's uuid 0.8 dependency gates new_v4 on this feature for Wasm targets.
uuid = { version = "0.8.2", features = ["wasm-bindgen"] }
